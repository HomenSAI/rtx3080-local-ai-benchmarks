name: local-ai-server

x-model-volume: &model-volume
  - type: bind
    source: ${MODEL_DIR:?Set MODEL_DIR in ai-server/.env}
    target: /models
    read_only: true
    bind:
      create_host_path: false

x-media-volume: &media-volume
  - type: bind
    source: ${MEDIA_DIR:?Set MEDIA_DIR in ai-server/.env}
    target: /media
    bind:
      create_host_path: false

x-runtime: &runtime
  init: true
  restart: "no"
  gpus: all
  volumes: *model-volume

x-llama-runtime: &llama-runtime
  <<: *runtime
  networks:
    default:
      aliases:
        - llama-active

x-upstream: &upstream
  image: local/ai-server-upstream:local
  build:
    context: .
    dockerfile: Dockerfile.upstream
    args:
      LLAMA_COMMIT: ${UPSTREAM_LLAMA_COMMIT:?Set UPSTREAM_LLAMA_COMMIT}

x-bonsai: &bonsai-image
  image: local/ai-server-bonsai:local
  build:
    context: .
    dockerfile: Dockerfile.bonsai
    args:
      PRISM_COMMIT: ${PRISM_LLAMA_COMMIT:?Set PRISM_LLAMA_COMMIT}

x-whisper: &whisper-image
  image: local/ai-server-whisper:local
  build:
    context: .
    dockerfile: Dockerfile.whisper
    args:
      WHISPER_COMMIT: ${WHISPER_CPP_COMMIT:?Set WHISPER_CPP_COMMIT}

x-llama-environment: &llama-environment
  LLAMA_HOST: 0.0.0.0
  LLAMA_GPU_LAYERS: all
  LLAMA_THREADS: ${LLAMA_THREADS:-4}
  LLAMA_THREADS_BATCH: ${LLAMA_THREADS_BATCH:-8}
  LLAMA_FLASH_ATTN: "on"
  LLAMA_PARALLEL: "1"
  LLAMA_METRICS: "1"
  LLAMA_BATCH_SIZE: ${LLAMA_BATCH_SIZE:-512}
  LLAMA_UBATCH_SIZE: ${LLAMA_UBATCH_SIZE:-128}
  LLAMA_JINJA: "1"
  LLAMA_SPEC_TYPE: none
  LLAMA_SPEC_DRAFT_N_MAX: ""
  LLAMA_SPEC_DRAFT_NGL: ""
  LLAMA_SPEC_DRAFT_MODEL: ""
  LLAMA_CACHE_TYPE_K: ""
  LLAMA_CACHE_TYPE_V: ""
  LLAMA_TEMPERATURE: ""
  LLAMA_TOP_P: ""
  LLAMA_TOP_K: ""
  LLAMA_MIN_P: ""

services:
  whisper:
    <<: [*whisper-image, *runtime]
    profiles: ["whisper"]
    pull_policy: never
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${WHISPER_PORT:-8082}:8082"
    volumes:
      - type: bind
        source: ${MODEL_DIR:?Set MODEL_DIR in ai-server/.env}
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_DIR:?Set MEDIA_DIR in ai-server/.env}
        target: /media
        bind:
          create_host_path: false
    command:
      - --model
      - ${WHISPER_MODEL:-/models/302_Whisper-large-v3-turbo/ggml-large-v3-turbo-q8_0.bin}
      - --host
      - 0.0.0.0
      - --port
      - "8082"
      - --inference-path
      - /inference
      - --convert
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5m

  media-tools:
    <<: *whisper-image
    profiles: ["media-tools"]
    pull_policy: never
    init: true
    restart: "no"
    volumes: *media-volume
    entrypoint: ["ffmpeg"]
    command: ["-version"]

  qwen-image:
    image: local/ai-server-qwen-image:local
    build:
      context: .
      dockerfile: Dockerfile.qwen-image
      args:
        STABLE_DIFFUSION_CPP_COMMIT: ${STABLE_DIFFUSION_CPP_COMMIT:?Set STABLE_DIFFUSION_CPP_COMMIT}
    profiles: ["qwen-image"]
    pull_policy: never
    init: true
    restart: "no"
    gpus: all
    volumes:
      - type: bind
        source: ${MODEL_DIR:?Set MODEL_DIR in ai-server/.env}
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_DIR:?Set MEDIA_DIR in ai-server/.env}
        target: /media
        bind:
          create_host_path: false
    environment:
      QWEN_IMAGE_MODEL: ${QWEN_IMAGE_MODEL:-/models/301_Qwen-Image-2.1/qwen-image-2.1-Q5_K_M.gguf}
      QWEN_IMAGE_VAE: ${QWEN_IMAGE_VAE:-/models/301_Qwen-Image-2.1/vae/qwen_image_2.1_vae_bf16.safetensors}
      QWEN_IMAGE_LLM: ${QWEN_IMAGE_LLM:-/models/015_Qwen3-VL-8B/Qwen3VL-8B-Instruct-Q4_K_M.gguf}
      QWEN_IMAGE_MMPROJ: ${QWEN_IMAGE_MMPROJ:-/models/015_Qwen3-VL-8B/mmproj/mmproj-Qwen3VL-8B-Instruct-F16.gguf}
    entrypoint: ["/app/bin/sd-cli"]

  llama-swap-gateway:
    image: local/ai-server-llama-swap:260
    build:
      context: .
      dockerfile: Dockerfile.llama-swap
      args:
        LLAMA_SWAP_VERSION: "260"
        LLAMA_SWAP_SHA256: d856a908507560cbdc253300bcf49092c7ead3c85098687428b0c9d4832ff46d
    profiles: ["gateway"]
    pull_policy: never
    container_name: ai-llama-swap-gateway
    init: true
    restart: unless-stopped
    stop_grace_period: 100s
    gpus: all
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    volumes:
      # 2026-09-29: models are served from an ext4 Docker volume (SHA256-verified copies of the E: files).
      # The E: bind over WSL 9p read at ~22-45 MB/s and made cold loads take 6-14 min; ext4 loads in 11-29 s.
      # Rollback: docker-compose.before-fastvol-20260929.yml
      - type: volume
        source: llm-models-fast
        target: /models
        read_only: true
      - type: bind
        source: ./config/llama-swap.yaml
        target: /etc/llama-swap/config.yaml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  llm-models-fast:
    external: true
