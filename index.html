<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>RTX 3080 local AI</title><style>
:root{--bg:#edf1f4;--surface:#f9fbfc;--ink:#14212e;--ink-2:#44525f;--ink-3:#5d6975;--line:#d9e0e6;--accent:#1e4f8a;--radius:18px;--max:1120px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--surface:#16212c;--ink:#e6ecf1;--ink-2:#a9b6c2;--ink-3:#6f7d8a;--line:#243240;--accent:#6f9fd8}}
:root[data-theme="dark"]{--bg:#0f1720;--surface:#16212c;--ink:#e6ecf1;--ink-2:#a9b6c2;--ink-3:#6f7d8a;--line:#243240;--accent:#6f9fd8}
*{box-sizing:border-box}
body{margin:0 auto;max-width:var(--max);padding:24px;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1{font-size:1.7em;letter-spacing:-0.02em}
h2{border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:1.6em}
a{color:var(--accent)}
nav a{margin-right:14px}
table{border-collapse:collapse;width:100%;margin:12px 0;display:block;overflow-x:auto;border-radius:var(--radius)}
td,th{border:1px solid var(--line);padding:4px 8px;text-align:left;white-space:nowrap}
th{background:var(--surface)}
tr:nth-child(even) td{background:var(--surface)}
code{font-family:"IBM Plex Mono",ui-monospace,monospace;background:var(--surface);padding:1px 4px;border-radius:4px}
pre{background:var(--surface);padding:12px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius)}
blockquote{border-left:3px solid var(--accent);margin:0;padding-left:12px;color:var(--ink-2)}
th.sortable{cursor:pointer;user-select:none;position:relative;padding-right:18px}
th.sortable:hover{background:var(--line)}
th.sortable::after{content:"\21C5";position:absolute;right:4px;opacity:.35}
th.sortable.asc::after{content:"\25B2";opacity:1}
th.sortable.desc::after{content:"\25BC";opacity:1}
td.lead1{background:color-mix(in srgb,var(--accent) 28%,var(--surface))!important;font-weight:700}
td.lead2{background:color-mix(in srgb,var(--accent) 16%,var(--surface))!important}
td.lead3{background:color-mix(in srgb,var(--accent) 8%,var(--surface))!important}
.sorthint{font-size:12px;color:var(--ink-3);margin:2px 0}
